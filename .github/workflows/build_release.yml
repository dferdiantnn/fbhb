name: 🍳 Masak HACKBEN APK & Windows EXE

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: 📱 Masak Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Kompilasi APK (Cloud Build)
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: 📦 Cari & Siapkan File APK
        run: |
          mkdir -p dist_apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist_apk/HACKBEN-Universal.apk \;
          ls -la dist_apk/

      - name: 📤 Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: HACKBEN-Android-APK
          path: dist_apk/*.apk

  build-windows-exe:
    name: 🪟 Masak Windows EXE
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller colorama playwright
          playwright install chromium

      - name: 🔨 Kompilasi Windows Standalone .EXE
        run: |
          pyinstaller --noconfirm --onefile --name "HACKBEN-Windows-x64" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "core;core" --add-data "data;data" main.py

      - name: 📤 Upload Artifact Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HACKBEN-Windows-EXE
          path: dist/*.exe

  publish-release:
    name: 🚀 Publikasikan ke GitHub Releases
    needs: [build-android-apk, build-windows-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: HACKBEN-Android-APK
          path: release_files

      - name: 📥 Download Windows EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: HACKBEN-Windows-EXE
          path: release_files

      - name: 🏷️ Buat / Perbarui GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 🍱 HACKBEN Multi-Platform Release (v41.2.8)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v41.2.8' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
